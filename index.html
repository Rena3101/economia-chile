<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Economía Chile · Panel diario</title>
<style>
:root{--bg:#F2E9FF;--card:#FFFFFF;--tx:#2A1459;--mut:#6F5E96;--bd:#D1B8FF;--ac:#6A2FC8;--ac2:#9D71E8;--hd:#6A2FC8;--hi:#6A2FC8;--sh:rgba(106,47,200,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B0F36;--card:#2A1A52;--tx:#F2E9FF;--mut:#D1B8FF;--bd:#6A2FC8;--ac:#D1B8FF;--hd:#D1B8FF;--sh:rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1B0F36;--card:#2A1A52;--tx:#F2E9FF;--mut:#D1B8FF;--bd:#6A2FC8;--ac:#D1B8FF;--hd:#D1B8FF;--sh:rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1040px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:0;color:var(--hd)}
.sub{color:var(--mut);margin:2px 0 18px;font-size:.92rem}
h2{font-size:1.05rem;margin:0 0 12px;color:var(--hd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:0 2px 12px var(--sh)}
.ind{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.ind .card{border-top:4px solid var(--ac2)}
.ind .l{color:var(--mut);font-size:.85rem}
.ind .v{font-size:1.7rem;font-weight:650;font-variant-numeric:tabular-nums;color:var(--hd)}
.ind .s{color:var(--mut);font-size:.78rem}
.res{background:var(--hi);color:#F2E9FF;border-color:transparent;margin-bottom:16px}
.res h2,.res li b{color:#fff}
.res ol{margin:0;padding-left:1.2em}
.res li{margin-bottom:10px}
.res li b{display:block;font-size:1.02rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
ul.n{list-style:none;margin:0;padding:0}
ul.n li{padding:10px 0;border-top:1px solid var(--bd)}
ul.n li:first-child{border-top:0;padding-top:0}
a{color:var(--ac);text-decoration:none}
a:hover{text-decoration:underline}
.d{color:var(--mut);font-size:.78rem;display:block}
footer{color:var(--mut);font-size:.8rem;margin-top:18px}
</style>
</head>
<body>
<main>
<h1>Economía Chile · Panel diario</h1>
<p class="sub" id="sub"></p>
<section class="ind" id="ind"></section>
<section class="card res"><h2>Lo más importante</h2><ol id="res"></ol></section>
<div class="cols">
<section class="card"><h2>BioBioChile · Economía</h2><ul class="n" id="bio"></ul></section>
<section class="card"><h2>Cooperativa · Mundo y negocios</h2><ul class="n" id="coop"></ul></section>
</div>
<footer id="foot"></footer>
</main>
<script>
var D={updated:"cargando…",ind:{fecha:"—",uf:"—",usd:"—",eur:"—"},resumen:[],bio:[],coop:[]};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function put(id,kids){var n=document.getElementById(id);n.textContent="";kids.forEach(function(k){n.appendChild(k)})}
function news(arr){return arr.map(function(n){var li=el("li"),a=el("a",null,n[0]);a.href=n[1];a.target="_blank";a.rel="noopener";li.appendChild(a);li.appendChild(el("span","d",n[2]));return li})}
function render(D){
document.getElementById("sub").textContent="Actualizado: "+D.updated;
var I=D.ind,items=[["UF",I.uf],["Dólar observado",I.usd],["Euro",I.eur]];
put("ind",items.map(function(x){var c=el("div","card");c.appendChild(el("div","l",x[0]));c.appendChild(el("div","v","$"+x[1]));c.appendChild(el("div","s","Banco Central de Chile · "+I.fecha));return c}));
put("res",D.resumen.map(function(r){var li=el("li");li.appendChild(el("b",null,r.t));if(r.d)li.appendChild(document.createTextNode(r.d));return li}));
put("bio",news(D.bio));put("coop",news(D.coop));
document.getElementById("foot").textContent="Fuentes: Banco Central de Chile (Indicadores diarios), BioBioChile y Cooperativa. Los titulares enlazan a la nota original. El resumen destaca los titulares con más palabras clave económicas.";
}
render(D);
try{fetch("data.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&j.ind)render(j)}).catch(function(){})}catch(e){}
</script>
</body>
</html>
