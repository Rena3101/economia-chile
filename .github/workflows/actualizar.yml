name: Actualizar datos
on:
  schedule:
    - cron: "0 * * * *"   # cada hora (hora UTC)
  workflow_dispatch:       # permite ejecutarlo a mano
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python actualizar.py
      - run: |
          git config user.name "bot-actualizador"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Actualiza datos" && git push)
